         viewBox="0 0 1440 900"
         preserveAspectRatio="xMidYMid slice"

        <!-- Sky gradient: near-black at top → deep warm amber-black at horizon -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#040405" />
          <stop offset="40%"  stop-color="#0d0418" />
          <stop offset="100%" stop-color="#2d0e05" />
        </linearGradient>

        <!-- Amber horizon glow — neon bar light spilling up from below mountains -->
        <radialGradient id="horizonGlow" cx="50%" cy="100%" r="60%" fx="50%" fy="100%">
          <stop offset="0%"  stop-color="#f59e0b" stop-opacity="0.35" />
          <stop offset="20%" stop-color="#c2410c" stop-opacity="0.28" />
          <stop offset="45%" stop-color="#7c2d12" stop-opacity="0.18" />
          <stop offset="70%" stop-color="#7c2d12" stop-opacity="0" />
        </radialGradient>

        <!-- Moon glow filter — warm amber -->
        <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feColorMatrix type="matrix"
            values="1 0.2 0 0 0
                    0.6 0.8 0 0 0
                    0   0   0.2 0 0
                    0   0   0   1 0" result="warmened"/>
          <feGaussianBlur in="warmened" stdDeviation="12" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Sky background rect -->
      <rect width="1440" height="900" fill="url(#skyGrad)" />

      <!-- Amber neon horizon glow — warm bar light spilling up from below mountains -->
      <ellipse cx="720" cy="900" rx="900" ry="420" fill="url(#horizonGlow)" />

      <circle cx="1100" cy="140" r="32" fill="#fbbf24" />

          id="name"

          placeholder="Jane Smith"
          required
          autocomplete="name"

          name="message"
          rows="6"
